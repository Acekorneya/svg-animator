<svg id="sva-widget-host-monitor-v1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="360" height="220" style="background-color:#0f172a" data-sva-widget-instance="host-monitor-v1">
  <defs>
