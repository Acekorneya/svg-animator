<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="400" height="240">
  <defs>
    <linearGradient id="unboundGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  <style>
    .spin-gear {
      transform-origin: 200px 120px;
      animation: spinGear 3s linear infinite;
    }
    @keyframes spinGear {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
  </style>
  <rect width="400" height="240" fill="#0f172a" />
  <g class="spin-gear">
    <circle cx="200" cy="120" r="50" fill="url(#unboundGrad)" stroke="#60a5fa" stroke-width="3" />
    <line x1="200" y1="60" x2="200" y2="180" stroke="#ffffff" stroke-width="4" />
    <line x1="140" y1="120" x2="260" y2="120" stroke="#ffffff" stroke-width="4" />
  </g>
  <text x="200" y="210" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Standard Unbound Animated SVG</text>
</svg>