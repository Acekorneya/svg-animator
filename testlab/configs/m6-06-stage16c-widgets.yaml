version: 1
inherits: base-kiwiberry.yaml
test:
  name: m6-06-stage16c-widgets
  description: M6 Study 6 — Complete Stage 16C exported widget dashboard scaling (50, 100, 250) and off-screen suspension.

execution:
  warmup_seconds: 0.5
  duration_seconds: 1.8
  repetitions: 3
  order_strategy: alternating

instances:
  counts: [50, 100, 250]
  isolation: stage16c-widgets

widget_runtime:
  package_dir: demos/stage16c-widget-consumer/packages/host-monitor-v1
  updates:
    enabled: true
    interval_ms: 1000
    properties:
      - name: hostname-node-text
        values: ["pve01", "pve02", "pve03", "pve04"]
      - name: status-glow-color
        values: ["#22c55e", "#f59e0b", "#ef4444"]
      - name: traffic-flow-speed
        values: [0.6, 1.2, 2.4]

workloads:
  - name: all-active
    visibility: all
  - name: vis-12-suspended
    visibility: dashboard
    visible_count: 12
    suspend_offscreen: true
