inherits: base-kiwiberry.yaml

test:
  name: yaml-handover-demo
  description: YAML-only workflow demonstration (shared-scene, 75 instances, custom speed 0.6s) without recompilation

execution:
  warmup_seconds: 0.5
  duration_seconds: 1.5
  repetitions: 1
  random_seed: 54321

instances:
  counts: [75]
  isolation: shared-scene

effects:
  - family: perimeter-tracer
    methods: [css, smil]
    shapes: [rectangle, circle]
    sizes:
      small: [40, 40]
      medium: [100, 65]
    speeds:
      fast: 0.6
    segment_counts: [2]
    line_gap_ratios: ["1:3"]

workloads:
  - name: all-active
    visibility: all
