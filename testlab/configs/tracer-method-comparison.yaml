inherits: base-kiwiberry.yaml

test:
  name: tracer-method-comparison
  description: Compare CSS, SMIL, JavaScript rAF, and clip-reveal perimeter tracer techniques across 50, 100, and 250 independent widgets

instances:
  counts: [50, 100, 250]
  isolation: independent-svg-roots

effects:
  - family: perimeter-tracer
    methods:
      - css
      - smil
      - javascript-raf
      - clip-reveal
    shapes:
      - rectangle
      - rounded-rectangle
      - circle
      - ellipse
    sizes:
      small: [40, 40]
      medium: [120, 80]
      large: [160, 100]
    speeds:
      slow: 8.0
      medium: 3.0
      fast: 0.8
    segment_counts: [1, 2, 4]
    line_gap_ratios: ["1:1", "1:3", "3:1"]

workloads:
  - name: all-active
    visibility: all
  - name: dashboard
    visible_count: 9
    suspend_offscreen: true
