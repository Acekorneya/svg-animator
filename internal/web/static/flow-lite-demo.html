<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stage 16D-B-M1 — Flow Lite Visual Demonstration &amp; Endpoint Showcase</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px 24px 36px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding-bottom: 14px;
      margin-bottom: 18px;
      border-bottom: 1px solid #30363d;
    }
    h1 { font-size: 1.3rem; color: #38bdf8; }
    .subtitle { font-size: 0.85rem; color: #8b949e; margin-top: 3px; }
    .badge {
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(460px, 1fr));
      gap: 14px;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 12px 14px;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }
    .card-title { font-size: 0.92rem; font-weight: 600; color: #f0f6fc; }
    .card-meta { font-size: 0.74rem; color: #7ee787; font-family: monospace; }
    .card-desc { font-size: 0.78rem; color: #8b949e; margin-bottom: 8px; }
    .stage-box {
      background: #090d13;
      border: 1px solid #21262d;
      border-radius: 6px;
      overflow: hidden;
      height: 126px;
    }
    .stage-box svg { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Stage 16D-B-M1 — Flow Lite Visual Demonstration</h1>
      <div class="subtitle">Side-by-side comparison of multi-point paths, per-section bends, Tunnel vs Abrupt endpoint modes, patterns, directions, and delays</div>
    </div>
    <span class="badge">10 Live Declarative SVG Examples</span>
  </header>

  <div class="grid" id="demoGrid"></div>

  <script src="/js/svg-widget.js"></script>
  <script src="/js/lite-effects.js"></script>
  <script>
    window.Stage = { canvasWidth: 500, canvasHeight: 126 };

    const examples = [
      {
        id: 'ex1',
        title: '1. Straight Two-Point Dashed Flow',
        meta: 'dashed • 2 pts • tunnel → tunnel',
        desc: 'Two-point straight connector with 24 px rounded dashes, 16 px gaps, and progressive tunnel entry/exit.',
        props: {
          id: 'ex1', kind: 'flow-lite', variant: 'dashed', color: '#38bdf8',
          points: [{ x: 10, y: 50 }, { x: 90, y: 50 }], bends: [0],
          dashLength: 24, gapLength: 16, strokeWidth: 4, segmentStyle: 'rounded',
          startMode: 'tunnel', endMode: 'tunnel', direction: 'forward', playbackMode: 'loop', speed: 2.0
        }
      },
      {
        id: 'ex2',
        title: '2. Four-Point Multi-Bend Path (Straight + Curved Sections)',
        meta: 'dashed • 4 pts • bends [0, +55, -55]',
        desc: 'Section 1 is straight (bend 0), Section 2 bends upward (+55), and Section 3 bends downward (-55).',
        props: {
          id: 'ex2', kind: 'flow-lite', variant: 'dashed', color: '#22c55e',
          points: [{ x: 8, y: 55 }, { x: 34, y: 55 }, { x: 64, y: 32 }, { x: 92, y: 62 }],
          bends: [0, 55, -55],
          dashLength: 22, gapLength: 14, strokeWidth: 4, segmentStyle: 'rounded',
          startMode: 'tunnel', endMode: 'tunnel', direction: 'forward', playbackMode: 'loop', speed: 2.2
        }
      },
      {
        id: 'ex3',
        title: '3. Dotted Flow Along Curved Path',
        meta: 'dotted • dotSize 8px • gap 18px',
        desc: 'True circular dots (stroke-linecap="round") travelling along a 3-point curved path.',
        props: {
          id: 'ex3', kind: 'flow-lite', variant: 'dotted', color: '#a371f7',
          points: [{ x: 10, y: 65 }, { x: 50, y: 25 }, { x: 90, y: 65 }],
          bends: [35, -35],
          dotSize: 8, gapLength: 18,
          startMode: 'tunnel', endMode: 'tunnel', direction: 'forward', playbackMode: 'loop', speed: 2.0
        }
      },
      {
        id: 'ex4',
        title: '4. Single Travelling Segment',
        meta: 'single • dashLength 52px • flat caps',
        desc: 'A single moving packet (52 px length) traversing a multi-bend path per cycle.',
        props: {
          id: 'ex4', kind: 'flow-lite', variant: 'single', color: '#f59e0b',
          points: [{ x: 10, y: 50 }, { x: 50, y: 50 }, { x: 90, y: 50 }],
          bends: [45, -45],
          dashLength: 52, strokeWidth: 5, segmentStyle: 'solid',
          startMode: 'tunnel', endMode: 'tunnel', direction: 'forward', playbackMode: 'loop', speed: 1.6
        }
      },
      {
        id: 'ex5',
        title: '5. Tunnel Entry + Tunnel Exit',
        meta: 'startMode: tunnel • endMode: tunnel',
        desc: 'Each dash grows smoothly from 0 to 32 px as it enters P0, and shortens from 32 px to 0 as it exits P_end.',
        props: {
          id: 'ex5', kind: 'flow-lite', variant: 'dashed', color: '#38bdf8',
          points: [{ x: 14, y: 50 }, { x: 50, y: 50 }, { x: 86, y: 50 }],
          bends: [35, -35],
          dashLength: 32, gapLength: 22, strokeWidth: 5, segmentStyle: 'solid',
          startMode: 'tunnel', endMode: 'tunnel', direction: 'forward', playbackMode: 'loop', speed: 2.2
        }
      },
      {
        id: 'ex6',
        title: '6. Tunnel Entry + Abrupt Exit',
        meta: 'startMode: tunnel • endMode: abrupt',
        desc: 'Each dash grows progressively from P0, then disappears instantaneously at full 32 px length at P_end while trailing dashes continue.',
        props: {
          id: 'ex6', kind: 'flow-lite', variant: 'dashed', color: '#f97316',
          points: [{ x: 14, y: 50 }, { x: 50, y: 50 }, { x: 86, y: 50 }],
          bends: [35, -35],
          dashLength: 32, gapLength: 22, strokeWidth: 5, segmentStyle: 'solid',
          startMode: 'tunnel', endMode: 'abrupt', direction: 'forward', playbackMode: 'loop', speed: 2.2
        }
      },
      {
        id: 'ex7',
        title: '7. Abrupt Entry + Tunnel Exit',
        meta: 'startMode: abrupt • endMode: tunnel',
        desc: 'Each dash appears immediately at full 32 px length at P0, then progressively shortens into the end tunnel at P_end.',
        props: {
          id: 'ex7', kind: 'flow-lite', variant: 'dashed', color: '#ec4899',
          points: [{ x: 14, y: 50 }, { x: 50, y: 50 }, { x: 86, y: 50 }],
          bends: [35, -35],
          dashLength: 32, gapLength: 22, strokeWidth: 5, segmentStyle: 'solid',
          startMode: 'abrupt', endMode: 'tunnel', direction: 'forward', playbackMode: 'loop', speed: 2.2
        }
      },
      {
        id: 'ex8',
        title: '8. Abrupt Entry + Abrupt Exit',
        meta: 'startMode: abrupt • endMode: abrupt',
        desc: 'Each dash appears at full 32 px length at P0 and disappears at full 32 px length at P_end without progressive clipping.',
        props: {
          id: 'ex8', kind: 'flow-lite', variant: 'dashed', color: '#eab308',
          points: [{ x: 14, y: 50 }, { x: 50, y: 50 }, { x: 86, y: 50 }],
          bends: [35, -35],
          dashLength: 32, gapLength: 22, strokeWidth: 5, segmentStyle: 'solid',
          startMode: 'abrupt', endMode: 'abrupt', direction: 'forward', playbackMode: 'loop', speed: 2.2
        }
      },
      {
        id: 'ex9',
        title: '9. Reverse Direction Flow (End → Start)',
        meta: 'direction: reverse • Pn → P0',
        desc: 'Segments travel from the last waypoint back to the first waypoint while honouring physical endpoint modes.',
        props: {
          id: 'ex9', kind: 'flow-lite', variant: 'dashed', color: '#06b6d4',
          points: [{ x: 12, y: 55 }, { x: 40, y: 30 }, { x: 68, y: 70 }, { x: 88, y: 45 }],
          bends: [30, -40, 30],
          dashLength: 24, gapLength: 16, strokeWidth: 4, segmentStyle: 'rounded',
          startMode: 'tunnel', endMode: 'tunnel', direction: 'reverse', playbackMode: 'loop', speed: 2.0
        }
      },
      {
        id: 'ex10',
        title: '10. Start Delay + End Delay with Ping-Pong / Loop Timing',
        meta: 'single • delay: 0.45s • endDelay: 0.65s • pingpong',
        desc: 'Single segment pauses 0.45 s at start, transits forward, pauses 0.65 s at end, and reverses back.',
        props: {
          id: 'ex10', kind: 'flow-lite', variant: 'single', color: '#10b981',
          points: [{ x: 14, y: 50 }, { x: 50, y: 28 }, { x: 86, y: 50 }],
          bends: [30, 30],
          dashLength: 44, strokeWidth: 5, segmentStyle: 'rounded',
          startMode: 'tunnel', endMode: 'abrupt', direction: 'forward', playbackMode: 'pingpong',
          speed: 1.3, delay: 0.45, endDelay: 0.65
        }
      }
    ];

    const grid = document.getElementById('demoGrid');
    examples.forEach((ex) => {
      const le = window.LiteEffects._migrateLiteEffect(ex.props);
      const geom = window.LiteEffects._computeFlowLiteGeometry(le, 0, 0);
      const elMarkup = window.LiteEffects.renderLiteElement(le);
      const markers = geom.pts.map((pt, idx) =>
        `<circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="4" fill="#0d1117" stroke="#8b949e" stroke-width="1.5" />` +
        `<text x="${(pt.x + 6).toFixed(1)}" y="${(pt.y - 6).toFixed(1)}" fill="#8b949e" font-size="10" font-family="monospace">P${idx + 1}</text>`
      ).join('');

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-header">
          <span class="card-title">${ex.title}</span>
          <span class="card-meta">${ex.meta}</span>
        </div>
        <div class="card-desc">${ex.desc}</div>
        <div class="stage-box">
          <svg viewBox="0 0 500 126" xmlns="http://www.w3.org/2000/svg">
            ${elMarkup}
            <g class="waypoint-markers" pointer-events="none">${markers}</g>
          </svg>
        </div>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
